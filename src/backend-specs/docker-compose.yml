version: '3.8'

services:
  nsitf-frontend:
    build:
      context: .
      dockerfile: src/backend-specs/Dockerfile
    ports:
      - "80:80"
    restart: always

  nsitf-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nsitf_ewompip_db
      POSTGRES_USER: nsitf_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NSITF_Secure_Pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nsitf-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
